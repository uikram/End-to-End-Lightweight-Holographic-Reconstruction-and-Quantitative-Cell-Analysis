<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">Hologram formation and reconstruction — the two geometries</text>

  <!-- OFF AXIS -->
  <rect x="20" y="42" width="466" height="228" fill="#fafafa" stroke="#ddd"/>
  <text x="34" y="64" font-size="13" font-weight="bold" fill="#4a6fa5">OFF-AXIS  ·  I = |R + P_z(o)|²</text>

  <line x1="44" y1="96" x2="140" y2="96" stroke="#c9a227" stroke-width="2"/>
  <text x="44" y="90" font-size="9.5" fill="#8a7b4f">object beam</text>
  <rect x="140" y="80" width="14" height="34" fill="#cfe0cf" stroke="#4a7a4a"/>
  <text x="147" y="126" font-size="9" text-anchor="middle" fill="#4a7a4a">cell</text>
  <line x1="154" y1="96" x2="300" y2="96" stroke="#c9a227" stroke-width="2" marker-end="url(#c)"/>
  <line x1="44" y1="152" x2="300" y2="112" stroke="#4a6fa5" stroke-width="2" marker-end="url(#c)"/>
  <text x="44" y="166" font-size="9.5" fill="#4a6fa5">reference beam R, TILTED</text>
  <rect x="300" y="66" width="12" height="76" fill="#333"/>
  <text x="306" y="158" font-size="9.5" text-anchor="middle">sensor</text>

  <!-- fringes -->
  <g stroke="#888" stroke-width="1">
    <line x1="330" y1="70" x2="330" y2="140"/><line x1="336" y1="70" x2="336" y2="140"/>
    <line x1="342" y1="70" x2="342" y2="140"/><line x1="348" y1="70" x2="348" y2="140"/>
    <line x1="354" y1="70" x2="354" y2="140"/><line x1="360" y1="70" x2="360" y2="140"/>
    <line x1="366" y1="70" x2="366" y2="140"/><line x1="372" y1="70" x2="372" y2="140"/>
  </g>
  <text x="351" y="158" font-size="9.5" text-anchor="middle">fringes — phase is fringe SHIFT</text>

  <!-- fourier -->
  <text x="34" y="196" font-size="11" font-weight="bold">Fourier domain of I :</text>
  <rect x="176" y="176" width="130" height="72" fill="#fff" stroke="#999"/>
  <circle cx="241" cy="212" r="13" fill="#888"/><text x="241" y="216" font-size="9" text-anchor="middle" fill="#fff">DC</text>
  <circle cx="205" cy="194" r="9" fill="#4a6fa5"/><text x="205" y="198" font-size="8" text-anchor="middle" fill="#fff">+1</text>
  <circle cx="277" cy="230" r="9" fill="#b3261e"/><text x="277" y="234" font-size="8" text-anchor="middle" fill="#fff">−1</text>
  <text x="320" y="196" font-size="10" fill="#333">the two first orders are</text>
  <text x="320" y="211" font-size="10" font-weight="bold" fill="#b3261e">CONJUGATES of equal magnitude</text>
  <text x="320" y="226" font-size="10" fill="#333">argmax picks one arbitrarily →</text>
  <text x="320" y="241" font-size="10" font-weight="bold" fill="#b3261e">wrong choice returns −φ</text>
  <text x="34" y="262" font-size="10" fill="#4a7a4a">FIX: pick the sideband whose order-2-detrended field is RIGHT-SKEWED (cells add optical path). 577/800 fields were previously wrong.</text>

  <!-- IN LINE -->
  <rect x="498" y="42" width="462" height="228" fill="#fafafa" stroke="#ddd"/>
  <text x="512" y="64" font-size="13" font-weight="bold" fill="#4a6fa5">IN-LINE GABOR  ·  I = |P_z(o)|²</text>

  <line x1="520" y1="110" x2="618" y2="110" stroke="#c9a227" stroke-width="2"/>
  <text x="520" y="102" font-size="9.5" fill="#8a7b4f">one beam only</text>
  <rect x="618" y="94" width="14" height="34" fill="#cfe0cf" stroke="#4a7a4a"/>
  <text x="625" y="140" font-size="9" text-anchor="middle" fill="#4a7a4a">cell</text>
  <path d="M632 110 Q 700 84 780 110" fill="none" stroke="#4a7a4a" stroke-width="1.4"/>
  <path d="M632 110 Q 700 136 780 110" fill="none" stroke="#4a7a4a" stroke-width="1.4"/>
  <line x1="632" y1="110" x2="780" y2="110" stroke="#c9a227" stroke-width="2"/>
  <text x="706" y="80" font-size="9" text-anchor="middle" fill="#4a7a4a">scattered</text>
  <text x="706" y="154" font-size="9" text-anchor="middle" fill="#8a7b4f">unscattered = the reference</text>
  <rect x="780" y="76" width="12" height="70" fill="#333"/>
  <text x="786" y="162" font-size="9.5" text-anchor="middle">sensor</text>

  <rect x="640" y="180" width="130" height="68" fill="#fff" stroke="#999"/>
  <circle cx="705" cy="214" r="26" fill="#ddd"/>
  <circle cx="705" cy="214" r="13" fill="#888"/><text x="705" y="218" font-size="9" text-anchor="middle" fill="#fff">DC</text>
  <text x="512" y="192" font-size="10" fill="#333">Object and its TWIN IMAGE are superposed;</text>
  <text x="512" y="207" font-size="10" fill="#333">no separated sideband exists, so filtering</text>
  <text x="512" y="222" font-size="10" fill="#333">cannot isolate the object.</text>
  <text x="512" y="243" font-size="10" font-weight="bold" fill="#b3261e">At z≈0 a pure phase object gives NO intensity</text>
  <text x="512" y="257" font-size="10" font-weight="bold" fill="#b3261e">contrast at all → forward model has no gradient.</text>

  <!-- reconstruction chain -->
  <text x="20" y="302" font-size="13" font-weight="bold">What the network is asked to replace — the classical off-axis chain (five operations, three of them non-local)</text>
  <g font-size="10">
    <rect x="24" y="316" width="104" height="44" rx="3" fill="#eef2f7" stroke="#4a6fa5"/><text x="76" y="336" text-anchor="middle">FFT</text><text x="76" y="350" text-anchor="middle" fill="#666">non-local</text>
    <line x1="130" y1="338" x2="150" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="152" y="316" width="120" height="44" rx="3" fill="#eef2f7" stroke="#4a6fa5"/><text x="212" y="332" text-anchor="middle">mask sideband</text><text x="212" y="348" text-anchor="middle" fill="#666">r=130 px, DC 60 px</text>
    <line x1="274" y1="338" x2="294" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="296" y="316" width="120" height="44" rx="3" fill="#eef2f7" stroke="#4a6fa5"/><text x="356" y="332" text-anchor="middle">roll to origin</text><text x="356" y="348" text-anchor="middle" fill="#666">removes tilt</text>
    <line x1="418" y1="338" x2="438" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="440" y="316" width="126" height="44" rx="3" fill="#eef2f7" stroke="#4a6fa5"/><text x="503" y="332" text-anchor="middle">propagate −z</text><text x="503" y="348" text-anchor="middle" fill="#666">angular spectrum</text>
    <line x1="568" y1="338" x2="588" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="590" y="316" width="118" height="44" rx="3" fill="#f3f0e8" stroke="#8a7b4f"/><text x="649" y="332" text-anchor="middle">unwrap</text><text x="649" y="348" text-anchor="middle" fill="#666">non-local</text>
    <line x1="710" y1="338" x2="730" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="732" y="316" width="140" height="44" rx="3" fill="#f3f0e8" stroke="#8a7b4f"/><text x="802" y="332" text-anchor="middle">remove aberration</text><text x="802" y="348" text-anchor="middle" fill="#666">order-3 polynomial</text>
    <line x1="874" y1="338" x2="894" y2="338" stroke="#444" marker-end="url(#c)"/>
    <rect x="896" y="316" width="64" height="44" rx="3" fill="#eaf3ea" stroke="#4a7a4a"/><text x="928" y="342" text-anchor="middle">φ (rad)</text>
  </g>

  <!-- angular spectrum -->
  <rect x="20" y="382" width="940" height="122" fill="#fafafa" stroke="#ddd"/>
  <text x="34" y="404" font-size="12.5" font-weight="bold">Angular-spectrum propagation, and why evanescent handling is not a nitpick</text>
  <text x="34" y="428" font-size="12" font-family="Georgia, serif">U(z) = F⁻¹{ F{u₀} · H },   H = exp( i·(2πz/λ)·√(1 − (λfx)² − (λfy)²) )</text>
  <text x="34" y="452" font-size="10.5" fill="#333">When 1 − (λfx)² − (λfy)² &lt; 0 the component is EVANESCENT. The code applies exp(−k|z|√(−arg)) rather than zeroing it.</text>
  <text x="34" y="470" font-size="10.5" fill="#b3261e">Zeroing would make the kernel a low-pass filter even at z = 0 — so propagating by zero would not return the field it was given,</text>
  <text x="34" y="486" font-size="10.5" fill="#b3261e">and the in-line hologram of a pure phase object would acquire contrast it does not physically have. The exp form equals 1 at z = 0.</text>
</svg>
