<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
  </defs>
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">Integrated-Phase Preservation — why per-cell, and what it costs to get the boundary wrong</text>

  <!-- A: mass chain -->
  <rect x="20" y="40" width="940" height="146" fill="#fafafa" stroke="#ddd"/>
  <text x="34" y="62" font-size="13" font-weight="bold" fill="#4a7a4a">A · From phase to picograms</text>
  <text x="34" y="88" font-size="11.5" fill="#333">n_cell = n_medium + α·C   (refractive index rises linearly with dry-mass concentration — Barer 1952)</text>
  <text x="34" y="110" font-size="11.5" fill="#333">φ = (2π/λ)·(n_cell − n_medium)·h  ⇒  ∬_Ω φ dx dy = (2πα/λ)·∬_Ω C·h dx dy = (2πα/λ)·m</text>
  <rect x="34" y="122" width="430" height="36" rx="4" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="249" y="146" font-size="14" text-anchor="middle" font-family="Georgia, serif">m = ( λ / 2πα ) · Σ_{p∈Ω} φ(p) · dx · dy      [pg]</text>
  <text x="486" y="136" font-size="10.5" fill="#333">λ = 0.666 µm,  α = 0.185 mL/g ≡ µm³/pg,  dx·dy = 0.060391 µm²</text>
  <text x="486" y="152" font-size="10.5" fill="#333">λ/(2πα) = 0.5729578 pg per rad·µm²</text>
  <text x="486" y="170" font-size="10.5" font-weight="bold" fill="#b3261e">Dry mass is the INTEGRAL of phase, not its mean.</text>
  <text x="34" y="176" font-size="10.5" fill="#b3261e">α cancels exactly from every RELATIVE metric (MAPE, ratio, bias). It affects only absolute pg: +6.9% / −14.0%.</text>

  <!-- B: cancellation -->
  <rect x="20" y="198" width="940" height="212" fill="#fafafa" stroke="#ddd"/>
  <text x="34" y="220" font-size="13" font-weight="bold" fill="#b3261e">B · The cancellation that image-level constraints cannot see  (asserted in scripts/selftest.py)</text>

  <text x="60" y="248" font-size="11.5" font-weight="bold">A field with two cells:</text>
  <circle cx="150" cy="300" r="34" fill="#cfe0cf" stroke="#4a7a4a" stroke-width="1.6"/>
  <text x="150" y="296" font-size="11" text-anchor="middle">cell 1</text>
  <text x="150" y="312" font-size="10" text-anchor="middle" fill="#666">V₁ = 100</text>
  <text x="150" y="352" font-size="11" text-anchor="middle" fill="#b3261e">predicted 120</text>
  <text x="150" y="367" font-size="11" text-anchor="middle" fill="#b3261e">error +20%</text>

  <circle cx="270" cy="300" r="34" fill="#cfe0cf" stroke="#4a7a4a" stroke-width="1.6"/>
  <text x="270" y="296" font-size="11" text-anchor="middle">cell 2</text>
  <text x="270" y="312" font-size="10" text-anchor="middle" fill="#666">V₂ = 100</text>
  <text x="270" y="352" font-size="11" text-anchor="middle" fill="#b3261e">predicted 80</text>
  <text x="270" y="367" font-size="11" text-anchor="middle" fill="#b3261e">error −20%</text>

  <line x1="330" y1="300" x2="368" y2="272" stroke="#444" stroke-width="1.5" marker-end="url(#d)"/>
  <line x1="330" y1="300" x2="368" y2="342" stroke="#444" stroke-width="1.5" marker-end="url(#d)"/>

  <rect x="372" y="240" width="272" height="62" rx="4" fill="#fff" stroke="#999"/>
  <text x="386" y="260" font-size="11.5" font-weight="bold">IMAGE-LEVEL  L_PV</text>
  <text x="386" y="278" font-size="11" font-family="Georgia, serif">|(120+80) − (100+100)| / 200</text>
  <text x="600" y="292" font-size="19" font-weight="bold" text-anchor="end" fill="#b3261e">0.0000</text>
  <text x="386" y="296" font-size="10" fill="#b3261e">a perfect score for a doubly-wrong field</text>

  <rect x="372" y="314" width="272" height="62" rx="4" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="386" y="334" font-size="11.5" font-weight="bold">PER-CELL  L_cIPP</text>
  <text x="386" y="352" font-size="11" font-family="Georgia, serif">½·(|120−100|/100 + |80−100|/100)</text>
  <text x="600" y="366" font-size="19" font-weight="bold" text-anchor="end" fill="#4a7a4a">0.2000</text>
  <text x="386" y="370" font-size="10" fill="#4a7a4a">sees both errors</text>

  <rect x="660" y="240" width="288" height="136" rx="4" fill="#fff" stroke="#999"/>
  <text x="674" y="260" font-size="11.5" font-weight="bold">The gradient it supplies</text>
  <text x="674" y="284" font-size="11" font-family="Georgia, serif">∂L/∂φ̂(p) = sign(V̂−V)/|V| · M̂(p)</text>
  <text x="674" y="306" font-size="11" font-family="Georgia, serif">∂L/∂M̂(p) = sign(V̂−V)/|V| · φ̂(p)</text>
  <text x="674" y="330" font-size="10.5" fill="#333">The push on the MASK at pixel p is weighted by</text>
  <text x="674" y="345" font-size="10.5" font-weight="bold" fill="#4a7a4a">how much phase is there.</text>
  <text x="674" y="363" font-size="10.5" fill="#333">Dice and cross-entropy have no such weighting —</text>
  <text x="674" y="371" font-size="10.5" fill="#333"> </text>
  <text x="674" y="371" font-size="10.5" fill="#333">that difference is what the study tests.</text>

  <!-- C: boundary error -->
  <rect x="20" y="422" width="940" height="182" fill="#fafafa" stroke="#ddd"/>
  <text x="34" y="444" font-size="13" font-weight="bold" fill="#8a7b4f">C · How a boundary error becomes a measurement error</text>

  <circle cx="140" cy="522" r="46" fill="#cfe0cf" stroke="#4a7a4a" stroke-width="2"/>
  <circle cx="140" cy="522" r="56" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="140" y="526" font-size="11" text-anchor="middle">true cell</text>
  <text x="140" y="596" font-size="10" text-anchor="middle" fill="#b3261e">predicted boundary, +k px</text>

  <text x="230" y="470" font-size="11.5" fill="#333">Extra annulus area  ≈  P · k   pixels    (P = perimeter)</text>
  <text x="230" y="494" font-size="11.5" font-family="Georgia, serif" fill="#333">Δm ≈ (λ/2πα)·dx·dy · P · k · φ̄_edge</text>
  <text x="230" y="522" font-size="11" fill="#333">1 · Error scales with PERIMETER, not area — worst for small and irregular cells.</text>
  <text x="230" y="540" font-size="11" fill="#333">2 · It scales with EDGE phase, which is low — so mass is hurt less than area by the same error.</text>
  <text x="230" y="558" font-size="11" fill="#333">3 · Therefore area error and mass error respond differently to the same boundary shift,</text>
  <text x="230" y="574" font-size="11" fill="#333">    and reporting both is genuinely informative.</text>
  <text x="230" y="594" font-size="11" font-weight="bold" fill="#b3261e">4 · It predicts Dice is the WRONG metric to optimise for mass accuracy. Boundary F1 is closer.</text>
</svg>
