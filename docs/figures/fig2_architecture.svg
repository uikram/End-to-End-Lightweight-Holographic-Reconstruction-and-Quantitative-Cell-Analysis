<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
    <marker id="bskip" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto">
      <path d="M0,0 L0,5.2 L7,2.6 z" fill="#8a7b4f"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#111">HoloQPINet — verified tensor shapes for a 900×900 input (padded to 928)</text>

  <!-- input -->
  <rect x="24" y="250" width="96" height="58" rx="4" fill="#eef2f7" stroke="#4a6fa5"/>
  <text x="72" y="272" font-size="11" text-anchor="middle">hologram</text>
  <text x="72" y="288" font-size="10" text-anchor="middle" fill="#666">(B,1,900,900)</text>
  <text x="72" y="302" font-size="9" text-anchor="middle" fill="#666">→ pad → 928²</text>

  <line x1="122" y1="279" x2="152" y2="279" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- encoder trapezoid stages -->
  <text x="290" y="60" font-size="12.5" font-weight="bold" fill="#4a7a4a" text-anchor="middle">MobileNetV2 encoder — 2.223 M (23.2%)</text>

  <rect x="156" y="196" width="60" height="166" rx="3" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="186" y="222" font-size="10" text-anchor="middle">stage0</text>
  <text x="186" y="236" font-size="9" text-anchor="middle" fill="#666">/2</text>
  <text x="186" y="252" font-size="9.5" text-anchor="middle" fill="#333">16 ch</text>
  <text x="186" y="266" font-size="9" text-anchor="middle" fill="#666">464²</text>

  <rect x="222" y="216" width="56" height="126" rx="3" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="250" y="242" font-size="10" text-anchor="middle">stage1</text>
  <text x="250" y="256" font-size="9" text-anchor="middle" fill="#666">/4</text>
  <text x="250" y="272" font-size="9.5" text-anchor="middle" fill="#333">24 ch</text>
  <text x="250" y="286" font-size="9" text-anchor="middle" fill="#666">232²</text>

  <rect x="284" y="234" width="54" height="90" rx="3" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="311" y="258" font-size="10" text-anchor="middle">stage2</text>
  <text x="311" y="272" font-size="9" text-anchor="middle" fill="#666">/8</text>
  <text x="311" y="286" font-size="9.5" text-anchor="middle" fill="#333">32 ch</text>
  <text x="311" y="300" font-size="9" text-anchor="middle" fill="#666">116²</text>

  <rect x="344" y="250" width="52" height="58" rx="3" fill="#eaf3ea" stroke="#4a7a4a"/>
  <text x="370" y="270" font-size="10" text-anchor="middle">stage3</text>
  <text x="370" y="283" font-size="9" text-anchor="middle" fill="#666">/16</text>
  <text x="370" y="296" font-size="9.5" text-anchor="middle" fill="#333">96 ch · 58²</text>

  <rect x="402" y="264" width="52" height="30" rx="3" fill="#d9e8d9" stroke="#4a7a4a" stroke-width="1.6"/>
  <text x="428" y="277" font-size="9.5" text-anchor="middle">stage4 /32</text>
  <text x="428" y="289" font-size="9" text-anchor="middle" fill="#333">1280 ch · 29²</text>

  <!-- split -->
  <line x1="456" y1="272" x2="500" y2="176" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="456" y1="286" x2="500" y2="400" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- phase decoder -->
  <text x="640" y="84" font-size="12.5" font-weight="bold" fill="#4a6fa5" text-anchor="middle">PHASE decoder — 3.678 M (38.3%)</text>
  <rect x="502" y="98" width="278" height="106" rx="4" fill="#eef2f7" stroke="#4a6fa5"/>
  <rect x="512" y="112" width="76" height="36" rx="3" fill="#fdeeee" stroke="#b3261e"/>
  <text x="550" y="126" font-size="9" text-anchor="middle" fill="#b3261e">ConvT 1280→640</text>
  <text x="550" y="140" font-size="9" text-anchor="middle" font-weight="bold" fill="#b3261e">3.28 M · 34%</text>
  <text x="596" y="134" font-size="10" fill="#333">+skip 96 → sep-conv → 256 ch, 58²</text>
  <text x="514" y="166" font-size="10" fill="#333">block1 → 128 ch, 116²   ·   block2 → 64 ch, 232²</text>
  <text x="514" y="184" font-size="10" fill="#333">block3 → 32 ch, 464²   ← trunk output, STRIDE 2</text>
  <text x="514" y="198" font-size="9" fill="#666">every fuse is a depthwise-separable conv</text>

  <line x1="782" y1="151" x2="812" y2="151" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="814" y="120" width="148" height="62" rx="4" fill="#fff" stroke="#4a6fa5"/>
  <text x="888" y="140" font-size="10.5" text-anchor="middle">PhaseHead 9.3 k</text>
  <text x="888" y="155" font-size="9.5" text-anchor="middle" fill="#666">3×3+BN+ReLU6 → 1×1</text>
  <text x="888" y="172" font-size="9.5" text-anchor="middle" fill="#b3261e">NO activation (radians)</text>

  <!-- amplitude -->
  <rect x="814" y="192" width="148" height="42" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="888" y="209" font-size="10" text-anchor="middle" fill="#888">AmplitudeHead 9.3 k</text>
  <text x="888" y="224" font-size="9" text-anchor="middle" fill="#888">1+0.3·tanh — DISABLED</text>
  <line x1="700" y1="204" x2="850" y2="190" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- seg decoder -->
  <text x="640" y="330" font-size="12.5" font-weight="bold" fill="#4a6fa5" text-anchor="middle">SEGMENTATION decoder — 3.678 M (38.3%)</text>
  <rect x="502" y="344" width="278" height="106" rx="4" fill="#eef2f7" stroke="#4a6fa5"/>
  <rect x="512" y="358" width="76" height="36" rx="3" fill="#fdeeee" stroke="#b3261e"/>
  <text x="550" y="372" font-size="9" text-anchor="middle" fill="#b3261e">ConvT 1280→640</text>
  <text x="550" y="386" font-size="9" text-anchor="middle" font-weight="bold" fill="#b3261e">3.28 M · 34%</text>
  <text x="596" y="380" font-size="10" fill="#333">identical structure, separate weights</text>
  <text x="514" y="412" font-size="10" fill="#333">256 → 128 → 64 → 32 ch</text>
  <text x="514" y="430" font-size="10" fill="#333">trunk output 32 ch, 464²  ← STRIDE 2</text>
  <text x="514" y="444" font-size="9" fill="#666">no attention anywhere in the network</text>

  <line x1="782" y1="397" x2="812" y2="397" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="814" y="368" width="148" height="58" rx="4" fill="#fff" stroke="#4a6fa5"/>
  <text x="888" y="388" font-size="10.5" text-anchor="middle">SegHead 9.3 k</text>
  <text x="888" y="403" font-size="9.5" text-anchor="middle" fill="#666">3×3+BN+ReLU6 → 1×1</text>
  <text x="888" y="418" font-size="9.5" text-anchor="middle" fill="#666">2 logits</text>

  <!-- skips -->
  <path d="M 186 196 C 186 96, 520 60, 540 98" fill="none" stroke="#8a7b4f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#bskip)"/>
  <path d="M 250 216 C 250 116, 520 76, 545 98" fill="none" stroke="#8a7b4f" stroke-width="1.1" stroke-dasharray="5 3"/>
  <path d="M 186 362 C 186 486, 520 500, 540 450" fill="none" stroke="#8a7b4f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#bskip)"/>
  <path d="M 250 342 C 250 470, 520 490, 545 450" fill="none" stroke="#8a7b4f" stroke-width="1.1" stroke-dasharray="5 3"/>
  <rect x="316" y="462" width="392" height="16" fill="#ffffff"/>
  <text x="322" y="474" font-size="10" fill="#8a7b4f">U-Net skip connections (concatenate), stages 0–3 → decoder blocks 0–3</text>

  <!-- final -->
  <rect x="24" y="490" width="936" height="52" rx="4" fill="#fff8e6" stroke="#8a7b4f"/>
  <text x="40" y="510" font-size="11.5" font-weight="bold" fill="#7a6a3f">Final resampling — both outputs are computed at stride 2 (464²) and BILINEARLY UPSAMPLED ×2 to 928², then cropped to 900².</text>
  <text x="40" y="530" font-size="10.5" fill="#7a6a3f">Consequence: the segmentation boundary — which sets projected area and near-edge phase integral — is resolved on a 2-pixel grid. Adding a 5th decoder block would give full resolution.</text>
</svg>
