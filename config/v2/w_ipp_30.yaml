# HoloQPI v2, weight sweep arm: cell_integrated_phase = 3.0
#
# WHY A SWEEP AND NOT A CHOSEN NUMBER. The per-cell term's gradient into the
# segmentation decoder is 0.302 times the segmentation loss's gradient on the
# same parameters (median over 30 batches, range 0.18-0.67), measured at
# WEIGHT 1.0 by scripts/check_gradient_path.py
# (runs/gradient_path_b_cell_ipp_512.csv). The objective adds w * term, so the
# ratio the optimiser actually sees is w * 0.302:
#
#   w = 0.1  ->  0.030   (segmentation ahead 33 : 1)
#   w = 0.3  ->  0.091   (11 : 1)
#   w = 1.0  ->  0.302   (3.3 : 1)
#   w = 3.0  ->  0.906   (1.1 : 1)
#
# At 0.1 the term is swamped, so a null result at that weight is a statement
# about the weight and not about the hypothesis. Reporting the sweep makes the
# distinction visible instead of leaving a single number to be argued about.
#
# The ratio is measured at w = 1.0; it is not the effective ratio at any weight.
extends: ../base.yaml

experiment_name: v2_ipp_w30

data:
  modality: off_axis

model:
  classifier_enabled: false

loss:
  weights:
    classification: 0.0
    cell_integrated_phase: 3.0
    boundary_gradient_alignment: 0.0
    projected_area_consistency: 0.0
    forward_model: 0.0
