# HoloQPI v2, weight sweep arm: cell_integrated_phase = 0.3
#
# WHY A SWEEP AND NOT A CHOSEN NUMBER. The per-cell term's gradient into the
# segmentation decoder is 0.25-0.29 times the segmentation loss's gradient on
# the same parameters, measured at WEIGHT 1.0 over several batches by
# scripts/check_gradient_path.py. The objective adds w * term, so the ratio the
# optimiser actually sees is w * 0.27:
#
#   w = 0.1  ->  0.027   (segmentation ahead 37 : 1)
#   w = 0.3  ->  0.081   (12 : 1)
#   w = 1.0  ->  0.27    (3.7 : 1)
#   w = 3.0  ->  0.81    (1.2 : 1)
#
# At 0.1 the term is swamped, so a null result at that weight is a statement
# about the weight and not about the hypothesis. Reporting the sweep makes the
# distinction visible instead of leaving a single number to be argued about.
#
# The gradient ratio was misread once in this project as if 0.299 were already
# the effective ratio at any weight. It is not. It is the ratio at w = 1.0.
extends: ../base.yaml

experiment_name: v2_ipp_w03

data:
  modality: off_axis

model:
  classifier_enabled: false

loss:
  weights:
    classification: 0.0
    cell_integrated_phase: 0.3
    boundary_gradient_alignment: 0.0
    projected_area_consistency: 0.0
    forward_model: 0.0
